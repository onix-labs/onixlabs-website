name: Site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # The download buttons link to the latest Studio and ONIXPlayer releases, which are looked up at build time. Every hour
  # the releases job checks whether the live site still links them, and rebuilds it when either app has a new release.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  releases:
    name: Check for new app releases
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
    steps:
      # The same releases the build picks (select-studio-release.ts, select-player-release.ts): the newest that isn't a
      # draft and is tagged as the app rather than a plugin. The live page links each by its tag, in the installer URLs
      # or, when a release has no installers yet, its release page.
      - name: Compare the latest releases with the live site
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          live="$(curl --fail --silent --show-error --location https://www.onixlabs.io/Products)"
          studio="$(gh api 'repos/onix-labs/onixlabs-studio/releases?per_page=100' --jq '[.[] | select(.draft | not) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+"))][0].tag_name // ""')"
          player="$(gh api 'repos/onix-labs/onixlabs-media-player/releases?per_page=100' --jq '[.[] | select(.draft | not) | select(.tag_name | test("^[0-9]+\\.[0-9]+\\.[0-9]+"))][0].tag_name // ""')"
          stale=false
          for tag in "$studio" "$player"; do
            if [ -n "$tag" ] && ! grep --quiet --fixed-strings "/$tag" <<< "$live"; then
              echo "The live site doesn't link $tag yet."
              stale=true
            fi
          done
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

  verify:
    name: Lint, test and build
    needs: releases
    # Runs on every push and pull request, and on the hourly schedule only when a release is missing from the live site.
    if: ${{ !failure() && !cancelled() && (github.event_name != 'schedule' || needs.releases.outputs.stale == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `npm run build` runs `astro check` first; content that breaks a schema in src/content.config.ts fails here.
      # The build looks up the latest ONIXLabs Studio release for the download button; the token avoids GitHub's
      # anonymous rate limit on shared runners.
      - name: Type-check and build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Lighthouse budgets
        run: npx lhci autorun

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          # .lighthouseci is a hidden folder, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          retention-days: 7

      - name: Upload site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Keeps dist/.well-known (security.txt), which the action otherwise drops as a hidden folder.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
