summary: >-
    Provides Corda developers with a modular toolkit of contract, workflow, and integration APIs to streamline CorDapp
    development. Instead of a standalone app, it offers reusable abstractions, utilities, and patterns for building
    scalable, maintainable solutions. With features like clean vault queries, transaction builders, standardized
    signing, and modular Gradle support, it reduces boilerplate and enforces consistency. Clear structure and seamless
    integration make it easy to adopt across projects.
