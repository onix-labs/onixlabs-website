description: >-
    ONIXLabs Core Library for Kotlin: composable specifications, checked type conversion, calendar day types, reflection
    helpers and everyday extensions.
callout: "Essential building blocks for modern Kotlin development"
lead: "Composable specifications, checked type conversion and the everyday extensions the Kotlin standard library leaves out."
icon: /onixlabs/images/icons/kotlin/kotlin-core-outline.svg
iconAlt: "Core Library for Kotlin"
summary: >-
    Foundational extensions and patterns that fill common gaps in the Kotlin standard library: composable, self-
    describing specifications, type conversion with overflow and precision checks, ordinal day-of-month types for
    calendar logic, reflection helpers and extensions for numbers, strings, comparables and collections. It is the base
    layer for the other ONIXLabs Kotlin libraries, and useful on its own in any Kotlin application.
hook: "The small, dependable pieces every Kotlin codebase ends up needing."
