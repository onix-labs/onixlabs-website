sections:
  - features:
        - title: "Primitive Type Extensions"
          body: >-
              Extension functions for Int, Float, Double, Long, Short, Byte, and BigDecimal provide constants like ZERO and ONE,
              as well as numeric utilities such as isInteger, toBigDecimal, toBigInteger, and more. These help express numeric
              logic clearly and idiomatically across different scales and types.
        - title: "String & Text Utilities"
          body: >-
              Adds the String.EMPTY constant and methods like wrap, toUpperSnakeCase, toLowerSnakeCase, toUpperKebabCase, and
              toLowerKebabCase. These provide fluent transformations for formatting, serialization, and identifier generation.
        - title: "Reflection Extensions"
          body: >-
              Extension support for KClass, and KType helps bridge Kotlin's reflection and sequence APIs with concise, reusable
              operations. These utilities enable safer introspection patterns.
        - title: "Date and Time Utilities"
          body: >-
              Utility functions in and domain types like DayOfMonth and DayOfMonthOccurrence provide expressive ways to model
              time-related logic, such as monthly scheduling and ISO duration formatting.
        - title: "Console Color"
          body: >-
              Console styling is powered by the ConsoleColor enum, which defines a full palette of ANSI-compatible foreground and
              background colors. Paired with ConsoleColorModifier, these colors can be dynamically formatted using escape
              sequences for terminal output. Extensions to the Console API make it easy to apply structured styles in CLI
              applications, ideal for highlighting logs, prompts, errors, and results with clear visual cues.
        - title: "Type Conversion API"
          body: >-
              A robust set of type converters; for example, IntTypeConverter, UUIDTypeConverter, BigDecimalTypeConverter, and
              more, enable safe, declarative casting between primitives and complex types. Includes custom exception handling via
              IllegalTypeConversionException for reliable validation.
