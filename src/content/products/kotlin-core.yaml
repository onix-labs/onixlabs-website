description: >-
    ONIXLabs Kotlin Core Library: extensions for primitive types and strings, reflection, date and time utilities,
    console colors and type conversion.
callout: "Essential building blocks for modern Kotlin development"
icon: /onixlabs/images/icons/kotlin/kotlin-core-outline.svg
iconAlt: "Kotlin Core Library"
summary: >-
    Offers a comprehensive set of Kotlin extensions and utilities designed to streamline common programming tasks. It
    enhances standard types like Byte, Int, Double, and String with fluent, expressive operations, while also extending
    collections and mathematical types for cleaner code. The library includes time-related helpers, lightweight
    reflection tools, and flexible type conversion APIs to reduce boilerplate and improve readability. Built with
    clarity and consistency in mind, it supports developers looking to write more idiomatic and maintainable Kotlin.
hook: "Not flashy, but fiercely practical. The kind of toolkit that's quietly dependable."
