packagesLabel: "View NuGet Packages"
sections:
  - features:
        - title: "Security Tokens"
          body: >-
              Easily generate highly secure tokens using either pseudo-random or cryptographically strong random number
              generators. With support for upper‑case and lower‑case letters, digits, special characters, and custom alphabets,
              the SecurityToken API gives you complete control over token format and entropy, ideal for use in authentication,
              session management, and more.
        - title: "Cryptographic Primitives"
          body: >-
              Reduce error-prone handling of raw byte arrays or strings with strongly typed primitives like DigitalSignature,
              PublicKey, PrivateKey, Hash, Salt, Secret, and MerkleTree. These wrappers encapsulate cryptographic semantics and
              securely manage sensitive data with value-type safety baked in.
        - title: "Asymmetric Cryptography"
          body: >-
              The library includes a full-featured API for public-key cryptography, delivering abstractions over EC
              Diffie-Hellman, ECDSA, and RSA. Your code can create and manage PublicKey and PrivateKey instances, perform secure
              key exchanges and digital signatures, and verify signatures seamlessly, while keeping private material safe.
        - title: "Merkle Trees"
          body: >-
              Build Merkle trees with high performance and modular hashing. Harness any HashAlgorithm implementation for tree
              generation and verify integrity at scale; for example, computing a Merkle root for 1 million leaves in milliseconds.
        - title: "Cryptographic Hashes"
          body: >-
              The Hash struct wraps cryptographic hash values in a semantic, type-safe primitive. It supports flexible creation
              from HashAlgorithm or keyed hash instances, alongside utilities for comparison, conversion, and storage.
        - title: "SHA-3 & SHAKE"
          body: >-
              Fully conformant with FIPS‑202, the library delivers SHA-3 hash functions (224/256/384/512 bits) and variable-length
              outputs via SHAKE128 and SHAKE256. A reliable, standardised, and cross-platform alternative to Merle-Damgård hash
              functions like SHA 1 and SHA 2.
        - title: "Salts"
          body: >-
              Manage salt values securely with the Salt struct, which generates cryptographically strong random salts and provides
              utility methods for consistent, secure generation, essential for hashing and password storage.
        - title: "Secrets"
          body: >-
              The Secret struct offers a secure, encrypted-in-memory container for sensitive data, protecting secrets at rest and
              in transit without exposing raw values. Ideal for API keys, tokens, or other credentials.
