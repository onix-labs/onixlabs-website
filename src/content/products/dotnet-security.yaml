pageTitle: "Security Library for .NET"
description: >-
    ONIXLabs Security Library for .NET: security tokens, hashes, digital signatures, key pairs, Merkle trees and a FIPS
    202 SHA-3 implementation.
callout: "Comprehensive security for your .NET application"
icon: /onixlabs/images/icons/dotnet/dotnet-security-outline.svg
iconAlt: "Security Library for .NET"
summary: >-
    Provides robust tools for secure data handling and cryptographic operations in .NET applications. It includes
    primitives like salts, hashes, digital signatures, key pairs, and a FIPS 202-compliant SHA-3 implementation. The
    library supports secure token generation and in-memory secret management to minimize exposure risks. Features like
    Merkle tree construction enable data integrity checks in distributed or tamper-resistant systems.
hook: "Built for high-assurance environments, it’s the cryptographic backbone of the ONIXLabs ecosystem."
repositoryUrl: https://github.com/onix-labs/onixlabs-dotnet
