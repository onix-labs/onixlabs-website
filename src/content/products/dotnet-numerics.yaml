summary: >-
    Numeric types for when the built-in ones aren't enough. BigDecimal stores decimals of any size exactly, Int256 to
    UInt512 extend the integers, Float128 and Float256 add quadruple and octuple precision, and NumberInfo takes numbers
    apart into their components. Everything plugs into .NET's generic math, and parses and formats according to culture.
hook: >-
    Designed for flexibility and accuracy, the Numerics library empowers developers to reliably work with numbers in
    scientific, financial, or engineering contexts.
