sections:
  - features:
        - title: "BigDecimal"
          body: >-
              The BigDecimal struct delivers arbitrary‑precision, base‑10 decimal arithmetic while implementing IFloatingPoint<T>.
              This means your numeric logic integrates seamlessly with .NET's generic math ecosystem, without sacrificing
              accuracy. Ideal for financial calculations, scientific models, and anywhere decimal exactness matters.
        - title: "NumberInfo"
          body: >-
              The NumberInfo struct decomposes numbers into their core components; including unscaled value, scale, exponent,
              precision, and sign. With built-in parsing and formatting, it's the ideal foundation for custom numeric types and
              data analysis scenarios.
        - title: "Generic Math Utilities"
          body: >-
              Extend .NET's generic math support with powerful helpers like Delta, Factorial, IntegerLength, MinMax, and Pow10.
              These utilities simplify complex numeric operations across data types with reusable, type-safe methods.
        - title: "Numeric Extensions"
          body: >-
              A comprehensive suite of extension methods enhances numeric workflows. Convert numbers to BigInteger, BigDecimal, or
              NumberInfo, extract unscaled values, adjust decimal scales, and more. These helpers make complex transformations
              feel intuitive and coding more expressive.
