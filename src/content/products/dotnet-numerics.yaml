summary: >-
    Extends .NET's generic math with powerful tools for precision, formatting, and numeric analysis. Features include an
    arbitrary-precision BigDecimal, culture-aware formatting, and a NumberInfo struct that reveals the inner workings of
    any number; significand, exponent, scale, and more. It also adds smart extensions like Pow10 and SetScale for
    fine-grained decimal control.
hook: >-
    Designed for flexibility and accuracy, the Numerics library empowers developers to reliably work with numbers in
    scientific, financial, or engineering contexts.
