summary: >-
    Foundational primitives, patterns and extensions that fill common gaps in .NET's base class library. It brings
    explicit, exception-free error handling with Result and Optional, reusable specifications, smart enumerations, guard
    clauses and strongly typed text encodings, and is the base layer for the other ONIXLabs libraries while remaining
    useful on its own.
