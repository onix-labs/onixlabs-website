sections:
  - heading: "Business Network Interoperability"
    paragraphs:
        - >-
            Corda nodes often participate in multiple business networks, each with unique standards for identity and governance.
            Without consistent APIs, implementations diverge, leading to fractured networks and limited interoperability.
        - >-
            The ONIXLabs Corda BNMS addresses this by introducing a protocol-level, standardised framework for membership and
            relationship governance. It enables business networks to operate autonomously while remaining interoperable with
            others—scalable, secure, and extensible.
        - >-
            Built atop the ONIXLabs Corda Identity Framework, BNMS promotes not just business network interoperability, but also
            seamless integration between Corda applications. Identity claims can be shared across networks, reducing duplication
            and ensuring consistency.
        - >-
            The BNMS supports both centralised networks governed by an operator, and decentralised networks governed
            collectively by their participants—offering full flexibility for regulatory, commercial, and trust-based governance
            models.
    features:
        - title: "Centralised Networks"
          body: >-
              In centrally governed networks, a designated Business Network Operator (BNO) oversees all membership and
              relationship activities. States must be attested by the BNO to be considered valid. This model ensures that the
              operator maintains full visibility and trust over all network activity.
        - title: "Decentralised Networks"
          body: >-
              BNMS allows for self-governed networks where trust is distributed. Here, membership and relationships must be
              attested by peers. Validity is subjective: a state is only recognised by those who have attested to it. This
              reflects a partial-trust model aligned with decentralised principles.
        - title: "Data Privacy"
          body: >-
              Identity information is managed by the ONIXLabs Identity Framework. Claims are attested independently of membership
              states, allowing identities to remain private while memberships remain verifiable. This separation ensures data
              minimisation, zero-knowledge compatibility, and secure verification.
        - title: "Dynamic Smart Contracts"
          body: >-
              Relationships in BNMS define rule sets and governance policies between parties. These are referenced by smart
              contracts at runtime, enabling logic to adapt dynamically based on off-ledger or policy-driven context—while
              remaining deterministic. This supports conditional access, multi-party authorisation, and programmable governance
              models.
        - title: "Membership Management"
          body: >-
              Memberships reference a specific business network and include configurable identity data, roles, permissions, and
              operational settings. A single node can manage multiple memberships across networks, each scoped independently and
              optionally governed by a BNO.
        - title: "Membership Issuance"
          body: >-
              Memberships are always self-issued—initiated by the joining member. Authorisation depends on attestation, either by
              a BNO or by peer members. The issuer is the only required signer for the issuance transaction.
        - title: "Membership Amendment"
          body: >-
              Members or BNOs can propose amendments to membership data. These changes require full attestation to become valid.
              All participants (including the member and the BNO or peers) must co-sign the amendment transaction.
        - title: "Membership Revocation"
          body: >-
              Memberships can be revoked by the member or optionally by a BNO. Revocation transactions require full participant
              consent to ensure that network exits are intentional, coordinated, and auditable.
        - title: "Relationship Management"
          body: >-
              Relationships define multi-party agreements within a business network. Each relationship encodes governance policies
              and participation rules. Nodes can define multiple relationships per network, scoped by their role and operational
              intent.
        - title: "Relationship Issuance"
          body: >-
              Any member—or a BNO—may propose a new relationship. All parties must attest and co-sign for it to be valid.
              Revocation locks are assigned at issuance to prevent accidental or malicious teardown. When decentralised,
              participants verify counterparties via attestation before signing.
        - title: "Relationship Amendment"
          body: >-
              Participants or BNOs may propose amendments. These transactions require all involved parties to verify and sign.
              Each node ensures updated states are consistent with previously attested versions before allowing amendments to
              proceed.
        - title: "Relationship Revocation"
          body: >-
              Any party can initiate revocation, but every participant must approve for it to succeed. Revocation locks—issued at
              creation—must be released by each participant to prevent unauthorised termination, adding a strong safeguard against
              unilateral exits.
  - heading: "Network Attestations"
    paragraphs:
        - >-
            Attestations are cryptographic acknowledgments of state. They are required for all decentralised membership and
            relationship validations. Without attestations, peers cannot be sure of a state’s authenticity—especially in
            peer-governed networks.
        - >-
            When a state is amended, all existing attestations become invalidated. This guarantees that attesters always
            acknowledge the latest state version. Each attestation explicitly points to a specific version of a state,
            supporting precise trust models.
        - >-
            Attestation flows ensure that all interactions are scoped to consented states, providing strong guarantees for
            identity, authorisation, and governance.
    features:
        - title: "Membership Attestation"
          body: >-
              Members must attest to each other’s membership records to enable interaction. Attestations serve as approval or
              rejection of a member’s identity, roles, and permissions. They are fundamental to flow-level authorisation logic.
        - title: "Attestation Issuance"
          body: >-
              Only the attester can issue an attestation. This is a unidirectional trust signal—accepting or rejecting a specific
              membership or relationship. Attestation issuance requires only the attester's signature.
        - title: "Attestation Amendment"
          body: >-
              When the underlying state changes, attesters must re-attest to the updated version. This ensures trust is always
              tied to current state and prevents stale authorisations.
        - title: "Attestation Revocation"
          body: >-
              Attesters can revoke previously granted attestations, signalling that a member or relationship is no longer trusted.
              This is essential for flows that validate participant state at runtime.
