description: >-
    ONIXLabs Corda BNMS: membership, relationship and attestation management for centralised and decentralised Corda
    business networks.
callout: "Streamlined membership and relationships for Corda business networks"
lead: "Membership and multi-party relationships for Corda business networks, with centralised or decentralised governance."
icon: /onixlabs/images/icons/corda/corda-bnms-outline.svg
summary: >-
    A robust Corda framework for managing membership and multi-party relationships in business networks. It supports
    centralised or decentralised governance through flexible permissions and attestations. Built on the ONIXLabs
    Identity Framework, it enables interoperable, privacy-aware identity management via standardised APIs and
    claim-based workflows. Membership lifecycle events are secured with tamper-resistant, multi-party processes.
repositoryUrl: https://github.com/onix-labs/onixlabs-corda-bnms
