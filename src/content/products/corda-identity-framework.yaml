pageTitle: "Corda Identity Framework"
description: >-
    ONIXLabs Corda Identity Framework: a claims-based identity model for Corda with claim states, claim pointers,
    attestations and accounts.
callout: "Secure, scalable identity management built for enterprise Corda"
icon: /onixlabs/images/icons/corda/corda-idfx-outline.svg
iconAlt: "Identity Framework for Corda"
summary: >-
    A powerful toolkit for building scalable, interoperable digital identities on Corda, supporting both individuals and
    organizations. Inspired by W3C Verifiable Credentials, it enables secure, privacy-preserving claims through a
    flexible hierarchy of types, including pointers and attestations. It supports evolving identity state transitions
    while minimizing data exposure, and introduces a multi-tenant account model with APIs for vault partitioning and
    cross-node account sharing.
hook: >-
    Built for modern identity on Corda, it gives developers the tools to deliver privacy-first, standards-aligned
    identity systems with ease.
