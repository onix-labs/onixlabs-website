packagesLabel: "View Maven Packages"
sections:
  - heading: "Claims-Based Identity Model"
    paragraphs:
        - >-
            A robust, claims-first identity framework tailored for Corda. A claim asserts a relationship in the form of a
            subject-property/value; for example, an individual's role, organizational affiliation, or asset ownership. This
            model delivers:
    bullets:
        - "Decentralized, self-controlled assertions."
        - "Scalable, cohesive identity structures."
        - "Enhanced resistance to forgery and impersonation."
        - "Elimination of monolithic data repositories."
        - "Minimal data disclosure for privacy."
        - "Support for zero-knowledge workflows."
        - "Data that remains secure, even if compromised."
    closingParagraphs:
        - >-
            Claims in ONIXLabs Corda Identity Framework are modeled via an extensible type hierarchy, ready for immediate use,
            yet flexible enough for custom claim types and domain-specific extensions.
    features:
        - title: "Claim States"
          body: >-
              Claim States represent assertions recorded on the ledger and shared between an issuer and holder, or self-issued
              when both roles coincide. State values can evolve over time, and claims support selective distribution, ensuring
              privacy through controlled disclosure.
        - title: "Claim Pointers"
          body: >-
              Claim Pointers are lightweight claims that reference other claims without exposing the full data. They come in two
              forms. Linear pointers always reference the latest version of a claim, whereas static pointers lock to a specific
              historical version.
        - title: "Attestations"
          body: >-
              Attestations serve as verifiable proofs that a state or claim has been reviewed; either validated or rejected.
              Importantly, recipients can rely on the attestation's validity without seeing the underlying claim, enabling
              privacy-preserving trust.
        - title: "Accounts"
          body: >-
              The framework also supports a Corda-native account model, allowing ledger states to be segmented by account instead
              of by node alone. Using AccountParty, this feature helps teams manage multi-tenant or identity-scoped workflows
              within and across nodes.
        - title: "Identity Workflows"
          body: >-
              Pre-built, end-to-end flows simplify working with identity constructs; issuing, amending, revoking, and publishing
              claims, attestations, and accounts, so developers can integrate identity logic with minimal overhead.
        - title: "Extension Services"
          body: >-
              Seamlessly integrate identity operations via CordaRPCOps with dedicated services for Claims, Attestations, and
              Accounts. These services wrap complex workflows into intuitive, RPC-accessible APIs, enabling faster development and
              operational clarity.
