description: >-
    ONIXLabs Graph Projection Library for Kotlin: convention-based object-to-object projection with type conversion,
    target factories and descriptive failures.
callout: "Convention-based object-to-object projection"
lead: "Convention-based object mapping that respects the Kotlin type system, with little or no mapping code."
icon: /onixlabs/images/icons/kotlin/kotlin-projection-outline.svg
iconAlt: "Graph Projection Library for Kotlin"
summary: >-
    Unobtrusive, convention-based object-to-object projection, as a plugin for the Graph library. Constructor parameters
    and properties are matched by name and converted along the way, a small DSL covers unconventional mappings, nested
    objects and collections are projected recursively, and every failure is reported at once with its path.
hook: "Mapping code you don't have to write."
repositoryUrl: https://github.com/onix-labs/onixlabs-kotlin
