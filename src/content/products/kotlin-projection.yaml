sections:
  - features:
        - title: "Type-Safe Projection"
          body: >-
              The Kotlin Projection API provides a robust, type-safe mechanism for mapping one object to another using Kotlin
              reflection. At its core is the Projector abstract class, which drives the transformation logic by inspecting
              constructor parameters and applying registered type converters. Projections can be fully automatic or manually
              customized through builder lambdas.
        - title: "Projection Builder DSL"
          body: >-
              The ProjectionBuilder offers a fluent DSL for defining projection rules, including support for custom value
              injection, conditional mapping, and cross-property conversions. It supports multiple syntaxes (e.g., by property, by
              name, or via lambda), enabling fine-grained control over how data flows from source to target types.
        - title: "Type Converter Configuration"
          body: >-
              Projections rely on a flexible TypeConverterConfiguration registry that resolves appropriate converters between
              types. Default behavior includes identity conversion for matching types and custom error handling for unknown
              mappings. You can register your own converters or override defaults for granular control of how values are
              translated.
        - title: "Projection Safety"
          body: >-
              Projection failures are wrapped in ProjectionException, with contextual diagnostics such as mismatched types,
              missing parameters, and nullability violations. ProjectionContext ensures every value is validated against its
              target parameter's constraints, enforcing safe, predictable transformation logic during runtime.
