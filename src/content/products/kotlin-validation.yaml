summary: >-
    A fluent, type-safe validation framework for Kotlin that enables clear, expressive checks across complex object
    graphs. It supports nested rules, functional error accumulation, and reusable validators with customizable
    messaging. Designed for minimal boilerplate and seamless domain integration, it makes enforcing business constraints
    straightforward and maintainable.
hook: "Not just a validator. It's the silent enforcer behind clean, dependable Kotlin code."
