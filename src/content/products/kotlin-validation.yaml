family: kotlin
order: 3
path: /Products/Kotlin/Validation
title: "Kotlin Graph Validation Library"
shortTitle: "Graph Validation"
pageTitle: "Graph Validation Library for Kotlin"
description: >-
    ONIXLabs Graph Validation Library for Kotlin: declarative validation of object graphs with nested rules, path-
    addressed results and machine-readable failures.
callout: "Fluent, inspectable validation of object graphs"
lead: "Declarative validation of whole object graphs, with every failure reported at its path."
icon: /onixlabs/images/icons/kotlin/kotlin-validation-outline.svg
iconAlt: "Graph Validation Library for Kotlin"
summary: >-
    Fluent, declarative validation of object graphs, as a plugin for the Graph library. Rules are declared alongside
    each type's graph and reused wherever the type appears, nested objects are validated through their own graphs, and
    results report every failure with its path, a machine-readable rule identifier and its parameters. The rules can
    even be described without a subject.
hook: "Rules declared once, failures you can act on."
repositoryUrl: https://github.com/onix-labs/onixlabs-kotlin
packagesUrl: https://github.com/orgs/onix-labs/packages?repo_name=onixlabs-kotlin
packagesLabel: "View Maven Packages"
sections:
  - features:
        - title: "Validation DSL"
          body: >-
              Declare rules for properties, collection elements, map keys and values, and no-argument functions
              alongside each type's graph, selecting members by reference or applying rules to all of them at once.
        - title: "Built-in Rules"
          body: >-
              Rules for strings, collections, maps, comparable values, booleans and any value: blank and empty checks,
              lengths, contents, prefixes and suffixes, regular expressions, UUIDs and Luhn checksums, counts,
              distinctness, exact contents, keys and entries, ranges, equality, identity and null checks.
        - title: "Custom and Conditional Rules"
          body: >-
              Reuse any core Specification as a rule, or write one as a lambda, and override any rule's message. Rules
              can apply conditionally with whenever and otherwise, and the condition is recorded on any failure it
              produces.
        - title: "Nested Validation"
          body: >-
              Validation descends into nested objects, collection elements and map values that have registered graphs,
              applying every graph in the class hierarchy and detecting cycles. Require a nested graph to be present, or
              skip one where descending isn't wanted.
        - title: "Hierarchical Results"
          body: >-
              Results mirror the shape of the subject, with the failures at each path, and can be queried by path or
              wildcard pattern, checked for validity or turned into an exception.
        - title: "Machine-Readable Failures"
          body: >-
              Every failure carries its path, a namespaced rule identifier such as string.notBlank, the rule's
              parameters and a message, so clients can act on failures rather than parse them. Results render as tree-
              shaped or flat JSON with no extra dependencies.
        - title: "Stop on the First Error"
          body: >-
              Collect every failure, or stop at the first when that's all you need to know.
        - title: "Rules Without a Subject"
          body: >-
              describe<T>() lists every rule that applies to a type, including conditional branches and subtypes, at
              wildcard paths, so rules can be documented or shown to users before anything is validated.
